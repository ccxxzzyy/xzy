<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>13-4 iconfont SVG 图标 · 移动端底部导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
            padding-bottom: calc(60px + env(safe-area-inset-bottom));
        }

        .xia-header {
            background: #fff;
            padding: 1.2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .xia-header h1 {
            font-size: 1.1rem;
            color: #333;
        }

        .xia-header .xia-home-link {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            color: #ff6b35;
            text-decoration: none;
            border: 1px solid #ff6b35;
            border-radius: 4px;
            padding: 0.2rem 0.6rem;
        }

        .xia-content {
            padding: 1.5rem 1rem;
            max-width: 480px;
            margin: 0 auto;
        }

        .xia-card {
            background: #fff;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .xia-card h2 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 0.6rem;
        }

        .xia-card p {
            font-size: 0.85rem;
            color: #999;
            line-height: 1.8;
        }

        .xia-demo-icon {
            width: 22px;
            height: 22px;
            vertical-align: middle;
            margin: 0 2px;
            fill: #ff6b35;
        }

        .xia-navbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            width: 100%;
            background: #fff;
            border-top: 1px solid #eee;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .xia-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.45rem 0 0.35rem;
            position: relative;
            text-decoration: none;
            color: #999;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.2s;
        }

        .xia-nav-item.xia-active {
            color: #ff6b35;
        }

        .xia-nav-icon-wrap {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        .xia-nav-icon {
            width: 24px;
            height: 24px;
            display: block;
        }

        .xia-badge {
            position: absolute;
            top: -7px;
            right: -14px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: #ff3b30;
            color: #fff;
            font-size: 10px;
            line-height: 16px;
            text-align: center;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }

        .xia-dot {
            position: absolute;
            top: -3px;
            right: -6px;
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
        }

        .xia-nav-label {
            font-size: 10px;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="xia-header">
        <h1>iconfont SVG 图标 · 移动端底部导航</h1>
        <a href="index.html" class="xia-home-link">首页</a>
    </div>

    <div class="xia-content">
        <div class="xia-card">
            <h2>SVG 图标方式</h2>
            <p>导航图标通过 SVG symbol 引用，使用 &lt;svg&gt;&lt;use&gt; 调用，图标为矢量图形，可用 fill 精确控制颜色：
                <svg class="xia-demo-icon"><use xlink:href="#icon-shouye1"></use></svg>
                <svg class="xia-demo-icon"><use xlink:href="#icon-faxian"></use></svg>
                <svg class="xia-demo-icon"><use xlink:href="#icon-weixin"></use></svg>
                <svg class="xia-demo-icon"><use xlink:href="#icon-wode"></use></svg>
            </p>
        </div>
        <div class="xia-card">
            <h2>数字徽章</h2>
            <p>「发现」与「我的」右上角显示数字徽章，提示未读数量。</p>
        </div>
        <div class="xia-card">
            <h2>红点提醒</h2>
            <p>「消息」与「首页」右上角显示小红点，表示有新消息。</p>
        </div>
        <div class="xia-card">
            <h2>自适应布局</h2>
            <p>底部导航固定于视口底部，宽度全屏，4 个导航项 flex 自适应平分，适配各种移动端屏幕尺寸。</p>
        </div>
    </div>

    <nav class="xia-navbar">
        <a href="javascript:void(0)" class="xia-nav-item xia-active">
            <span class="xia-nav-icon-wrap">
                <svg class="xia-nav-icon"><use xlink:href="#icon-shouye1"></use></svg>
                <span class="xia-dot"></span>
            </span>
            <span class="xia-nav-label">首页</span>
        </a>
        <a href="javascript:void(0)" class="xia-nav-item">
            <span class="xia-nav-icon-wrap">
                <svg class="xia-nav-icon"><use xlink:href="#icon-faxian"></use></svg>
                <span class="xia-badge">8</span>
            </span>
            <span class="xia-nav-label">发现</span>
        </a>
        <a href="javascript:void(0)" class="xia-nav-item">
            <span class="xia-nav-icon-wrap">
                <svg class="xia-nav-icon"><use xlink:href="#icon-weixin"></use></svg>
                <span class="xia-dot"></span>
            </span>
            <span class="xia-nav-label">消息</span>
        </a>
        <a href="javascript:void(0)" class="xia-nav-item">
            <span class="xia-nav-icon-wrap">
                <svg class="xia-nav-icon"><use xlink:href="#icon-wode"></use></svg>
                <span class="xia-badge">3</span>
            </span>
            <span class="xia-nav-label">我的</span>
        </a>
    </nav>

    <script src="font/font_5244859_igt0lytephh/iconfont.js"></script>
</body>
</html>
