<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2>夏志远 javascript</h2>
    <script>
       //输出，夏志远，你好，document ,alert,console三种方式
       document.write("夏志远，你好");
       alert("夏志远，你好");
       console.log("夏志远，你好");
       //confirm和prompt
       confirm("夏志远，你好");
       prompt("夏志远，你好");
    </script>
</body>
</html>
