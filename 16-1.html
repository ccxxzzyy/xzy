<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-1 JS 数组方法可视化</title>
    <style>
        :root {
            --xzy_bg: #0b0f1a;
            --xzy_panel: #141b2d;
            --xzy_panel_deep: #0d1322;
            --xzy_line: rgba(255, 255, 255, 0.08);
            --xzy_ink: #e8ecf5;
            --xzy_muted: #8a94ad;
            --xzy_teal: #5eead4;
            --xzy_blue: #60a5fa;
            --xzy_amber: #fbbf24;
            --xzy_rose: #fb7185;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(1100px 620px at 15% -12%, #16243d 0%, var(--xzy_bg) 58%) fixed;
            color: var(--xzy_ink);
            min-height: 100vh;
            padding: 34px 18px 70px;
            line-height: 1.6;
        }

        .xzy_wrap {
            max-width: 1000px;
            margin: 0 auto;
        }

        .xzy_back {
            display: inline-block;
            text-decoration: none;
            color: var(--xzy_muted);
            font-size: 13px;
            padding: 5px 14px;
            border: 1px solid var(--xzy_line);
            border-radius: 999px;
            transition: 0.2s;
        }

        .xzy_back:hover {
            color: var(--xzy_teal);
            border-color: var(--xzy_teal);
        }

        .xzy_header h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 20px 0 6px;
        }

        .xzy_header h1 span {
            color: var(--xzy_teal);
        }

        .xzy_header p {
            font-size: 14px;
            color: var(--xzy_muted);
        }

        .xzy_header p b {
            color: var(--xzy_amber);
            font-weight: 600;
        }

        .xzy_panel {
            margin-top: 26px;
            background: var(--xzy_panel);
            border: 1px solid var(--xzy_line);
            border-radius: 16px;
            padding: 18px 20px 20px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        .xzy_panel_head {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .xzy_panel_title {
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--xzy_muted);
        }

        .xzy_panel_title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--xzy_teal);
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: 1px;
            box-shadow: 0 0 10px var(--xzy_teal);
        }

        .xzy_len {
            font-family: Consolas, monospace;
            font-size: 13px;
            color: var(--xzy_muted);
        }

        .xzy_len b {
            color: var(--xzy_teal);
        }

        .xzy_reset {
            margin-left: auto;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            color: var(--xzy_muted);
            background: transparent;
            border: 1px solid var(--xzy_line);
            border-radius: 999px;
            padding: 5px 14px;
            transition: 0.2s;
        }

        .xzy_reset:hover {
            color: var(--xzy_amber);
            border-color: var(--xzy_amber);
        }

        .xzy_array_row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
            min-height: 88px;
            padding: 16px;
            background: var(--xzy_panel_deep);
            border-radius: 12px;
            border: 1px dashed rgba(94, 234, 212, 0.25);
        }

        .xzy_chip {
            position: relative;
            min-width: 58px;
            padding: 12px 10px 24px;
            border-radius: 10px;
            text-align: center;
            background: linear-gradient(180deg, #1e2a44, #182135);
            border: 1px solid rgba(94, 234, 212, 0.28);
            font-family: Consolas, monospace;
            font-size: 17px;
            color: var(--xzy_ink);
            animation: xzy_pop 0.3s ease;
        }

        .xzy_chip_idx {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3px;
            font-size: 10px;
            color: #64708c;
            font-family: Consolas, monospace;
        }

        .xzy_chip_new {
            border-color: var(--xzy_teal);
            background: linear-gradient(180deg, #134e4a, #0f2f2c);
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.14);
            animation: xzy_pop 0.36s ease;
        }

        .xzy_empty {
            color: var(--xzy_muted);
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        @keyframes xzy_pop {
            0% {
                transform: scale(0.72) translateY(8px);
                opacity: 0;
            }
            60% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .xzy_tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 22px 0 14px;
        }

        .xzy_tab {
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            color: var(--xzy_muted);
            background: rgba(20, 27, 45, 0.8);
            border: 1px solid var(--xzy_line);
            border-radius: 999px;
            padding: 7px 16px;
            transition: 0.2s;
        }

        .xzy_tab:hover {
            color: var(--xzy_ink);
            border-color: rgba(94, 234, 212, 0.4);
        }

        .xzy_tab.xzy_tab_on {
            background: var(--xzy_teal);
            border-color: var(--xzy_teal);
            color: #08221f;
            font-weight: 600;
        }

        .xzy_tab_note {
            align-self: center;
            font-size: 12px;
            color: #5d6883;
            margin-left: 4px;
        }

        .xzy_methods {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .xzy_mbtn {
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            color: var(--xzy_ink);
            background: var(--xzy_panel);
            border: 1px solid var(--xzy_line);
            border-left: 3px solid var(--xzy_rose);
            border-radius: 10px;
            padding: 10px 12px;
            transition: 0.18s;
        }

        .xzy_mbtn b {
            display: block;
            font-family: Consolas, monospace;
            font-size: 14.5px;
            font-weight: 600;
        }

        .xzy_mbtn small {
            color: var(--xzy_muted);
            font-size: 11.5px;
        }

        .xzy_mbtn:hover {
            transform: translateY(-2px);
            background: #1a2337;
            border-color: rgba(94, 234, 212, 0.5);
        }

        .xzy_mbtn.xzy_mbtn_immut {
            border-left-color: var(--xzy_blue);
        }

        .xzy_result {
            margin-top: 22px;
            padding: 18px;
            background: var(--xzy_panel_deep);
            border: 1px solid var(--xzy_line);
            border-radius: 14px;
        }

        .xzy_result_top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .xzy_result_name {
            font-family: Consolas, monospace;
            font-size: 18px;
            color: var(--xzy_teal);
        }

        .xzy_badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(251, 113, 133, 0.12);
            color: var(--xzy_rose);
            border: 1px solid rgba(251, 113, 133, 0.35);
        }

        .xzy_badge.xzy_badge_immut {
            background: rgba(96, 165, 250, 0.12);
            color: var(--xzy_blue);
            border-color: rgba(96, 165, 250, 0.35);
        }

        .xzy_code {
            font-family: Consolas, monospace;
            font-size: 13.5px;
            color: #7dd3fc;
            background: #0a1020;
            border-left: 2px solid var(--xzy_teal);
            border-radius: 8px;
            padding: 11px 14px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .xzy_ret {
            margin-top: 12px;
            font-size: 13px;
            color: var(--xzy_muted);
            font-family: Consolas, monospace;
        }

        .xzy_ret b {
            color: var(--xzy_amber);
            font-size: 15px;
            font-weight: 600;
        }

        .xzy_steps {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .xzy_step {
            font-family: Consolas, monospace;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 999px;
            color: #a9b4cc;
            background: #16203a;
            border: 1px solid var(--xzy_line);
            animation: xzy_pop 0.24s ease;
        }

        .xzy_step.xzy_keep {
            color: var(--xzy_teal);
            background: rgba(94, 234, 212, 0.08);
            border-color: rgba(94, 234, 212, 0.4);
        }

        .xzy_step.xzy_drop {
            color: var(--xzy_rose);
            background: rgba(251, 113, 133, 0.07);
            border-color: rgba(251, 113, 133, 0.35);
        }

        .xzy_note {
            margin-top: 12px;
            font-size: 13px;
            color: var(--xzy_muted);
            line-height: 1.8;
        }

        .xzy_note em {
            font-style: normal;
            color: var(--xzy_ink);
        }

        .xzy_compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
        }

        .xzy_cmp {
            background: var(--xzy_panel);
            border: 1px solid var(--xzy_line);
            border-radius: 12px;
            padding: 14px;
        }

        .xzy_cmp_head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--xzy_muted);
            margin-bottom: 10px;
        }

        .xzy_delta {
            font-family: Consolas, monospace;
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 999px;
            color: var(--xzy_amber);
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .xzy_delta.xzy_delta_zero {
            color: var(--xzy_muted);
            background: transparent;
            border-color: var(--xzy_line);
        }

        .xzy_row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 70px;
            align-items: flex-end;
        }

        .xzy_row_before .xzy_chip {
            opacity: 0.45;
            border-color: rgba(255, 255, 255, 0.12);
            background: #151c2c;
            animation: none;
        }

        .xzy_foot {
            margin-top: 26px;
            font-size: 12px;
            color: #5d6883;
            text-align: center;
        }

        @media (max-width: 720px) {
            .xzy_header h1 {
                font-size: 24px;
            }

            .xzy_compare {
                grid-template-columns: 1fr;
            }

            .xzy_methods {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
<div class="xzy_wrap">
    <a class="xzy_back" href="index.html">← 返回首页</a>

    <header class="xzy_header">
        <h1>JavaScript <span>数组方法</span> 可视化</h1>
        <p>点击方法按钮，观察数组的长度、元素位置与返回值如何变化 · 共 <b>22</b> 个常用方法</p>
    </header>

    <section class="xzy_panel">
        <div class="xzy_panel_head">
            <span class="xzy_panel_title">当前数组</span>
            <span class="xzy_len">length = <b id="xzy_len">5</b></span>
            <button class="xzy_reset" id="xzy_reset" type="button">重置数组</button>
        </div>
        <div class="xzy_array_row" id="xzy_array"></div>
    </section>

    <nav class="xzy_tabs" id="xzy_tabs"></nav>
    <div class="xzy_methods" id="xzy_methods"></div>

    <section class="xzy_result">
        <div class="xzy_result_top">
            <span class="xzy_result_name" id="xzy_result_name">map()</span>
            <span class="xzy_badge xzy_badge_immut" id="xzy_badge">不改变原数组</span>
        </div>
        <pre class="xzy_code" id="xzy_code">arr.map(x => x * 2)</pre>
        <div class="xzy_ret">返回值 = <b id="xzy_ret">—</b></div>
        <div class="xzy_steps" id="xzy_steps"></div>
        <p class="xzy_note" id="xzy_note">选择一个方法开始演示。</p>
    </section>

    <section class="xzy_compare">
        <div class="xzy_cmp">
            <div class="xzy_cmp_head">执行前 <span class="xzy_delta xzy_delta_zero" id="xzy_delta_before">原数组</span></div>
            <div class="xzy_row xzy_row_before" id="xzy_before"></div>
        </div>
        <div class="xzy_cmp">
            <div class="xzy_cmp_head">执行后 <span class="xzy_delta" id="xzy_delta">长度不变</span></div>
            <div class="xzy_row" id="xzy_after"></div>
        </div>
    </section>

    <p class="xzy_foot">红色左边线 = 直接修改原数组 ｜ 蓝色左边线 = 返回新数组或新值，原数组保持不变</p>
</div>

<script>
(function () {
    'use strict';

    var xzy_seed = [7, 12, 5, 8, 20];
    var xzy_arr = xzy_seed.slice();
    var xzy_cat = 'mutate';

    var xzy_cats = [
        { id: 'mutate', name: '增删改', note: '这些方法会直接改变原数组' },
        { id: 'pure', name: '截取 / 拼接', note: '返回新数组或新字符串，原数组不动' },
        { id: 'find', name: '查找', note: '判断元素位置或是否存在' },
        { id: 'iter', name: '遍历 / 转换', note: '对每个元素执行回调，多数返回新值' }
    ];

    var xzy_methods = [
        {
            key: 'push', cat: 'mutate', name: 'push()', hint: '末尾添加', mut: true,
            run: function () {
                var xzy_len = xzy_arr.push(60);
                return {
                    code: 'arr.push(60)',
                    ret: xzy_len,
                    note: '在数组<em>末尾</em>追加一个元素，直接修改原数组，返回值是新的 length。',
                    steps: []
                };
            }
        },
        {
            key: 'unshift', cat: 'mutate', name: 'unshift()', hint: '头部添加', mut: true,
            run: function () {
                var xzy_len = xzy_arr.unshift(0);
                return {
                    code: 'arr.unshift(0)',
                    ret: xzy_len,
                    note: '在数组<em>开头</em>插入元素，原有元素整体后移一位，返回新长度。',
                    steps: []
                };
            }
        },
        {
            key: 'pop', cat: 'mutate', name: 'pop()', hint: '删除末尾', mut: true,
            run: function () {
                var xzy_v = xzy_arr.pop();
                return {
                    code: 'arr.pop()',
                    ret: xzy_v,
                    note: '删除并<em>返回最后一个元素</em>，数组长度减一；空数组调用返回 undefined。',
                    steps: []
                };
            }
        },
        {
            key: 'shift', cat: 'mutate', name: 'shift()', hint: '删除头部', mut: true,
            run: function () {
                var xzy_v = xzy_arr.shift();
                return {
                    code: 'arr.shift()',
                    ret: xzy_v,
                    note: '删除并<em>返回第一个元素</em>，后面所有元素的下标都向前移动一位。',
                    steps: []
                };
            }
        },
        {
            key: 'splice', cat: 'mutate', name: 'splice()', hint: '删除 / 插入', mut: true,
            run: function () {
                var xzy_removed = xzy_arr.splice(1, 2);
                return {
                    code: 'arr.splice(1, 2)',
                    ret: xzy_removed,
                    note: '从下标 1 开始删除 2 项，返回被删除元素组成的新数组，原数组被改变。写成 splice(1, 0, 99) 就是插入而不是删除。',
                    steps: []
                };
            }
        },
        {
            key: 'reverse', cat: 'mutate', name: 'reverse()', hint: '颠倒顺序', mut: true,
            run: function () {
                xzy_arr.reverse();
                return {
                    code: 'arr.reverse()',
                    ret: xzy_arr.slice(),
                    note: '把数组顺序完全颠倒，<em>在原数组上操作</em>，返回值仍然是这个原数组。',
                    steps: []
                };
            }
        },
        {
            key: 'sort', cat: 'mutate', name: 'sort()', hint: '排序', mut: true,
            run: function () {
                xzy_arr.sort(function (xzy_a, xzy_b) { return xzy_a - xzy_b; });
                return {
                    code: 'arr.sort((a, b) => a - b)',
                    ret: xzy_arr.slice(),
                    note: '默认按字符串比较，所以数字要传比较函数：<em>a - b 升序</em>，b - a 降序。它会改变原数组。',
                    steps: []
                };
            }
        },
        {
            key: 'fill', cat: 'mutate', name: 'fill()', hint: '填充', mut: true,
            run: function () {
                xzy_arr.fill(0, 1, 3);
                return {
                    code: 'arr.fill(0, 1, 3)',
                    ret: xzy_arr.slice(),
                    note: '把下标 1 到 2（含头不含尾）的元素全部替换成 0，直接改写原数组。',
                    steps: []
                };
            }
        },
        {
            key: 'slice', cat: 'pure', name: 'slice()', hint: '截取一段', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.slice(1, 3);
                return {
                    code: 'arr.slice(1, 3)',
                    ret: xzy_ret,
                    note: '从下标 1 取到下标 3（含头不含尾），<em>返回新数组</em>，原数组完全不受影响。',
                    steps: []
                };
            }
        },
        {
            key: 'concat', cat: 'pure', name: 'concat()', hint: '拼接数组', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.concat([70, 80]);
                return {
                    code: 'arr.concat([70, 80])',
                    ret: xzy_ret,
                    note: '把另一个数组接到后面，<em>返回拼接后的新数组</em>，原数组保持不变。',
                    steps: []
                };
            }
        },
        {
            key: 'join', cat: 'pure', name: 'join()', hint: '转成字符串', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.join(' - ');
                return {
                    code: 'arr.join(" - ")',
                    ret: xzy_ret,
                    note: '用指定分隔符把元素连成<em>字符串</em>，返回的是字符串而不是数组。',
                    steps: []
                };
            }
        },
        {
            key: 'indexOf', cat: 'find', name: 'indexOf()', hint: '找下标', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.indexOf(8);
                return {
                    code: 'arr.indexOf(8)',
                    ret: xzy_ret,
                    note: '从左往右找<em>第一个匹配元素的下标</em>，找不到返回 -1。使用全等比较，NaN 永远找不到。',
                    steps: []
                };
            }
        },
        {
            key: 'includes', cat: 'find', name: 'includes()', hint: '是否存在', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.includes(8);
                return {
                    code: 'arr.includes(8)',
                    ret: xzy_ret,
                    note: '判断数组中<em>是否包含</em>某个元素，返回 true / false，比 indexOf 更直观。',
                    steps: []
                };
            }
        },
        {
            key: 'find', cat: 'find', name: 'find()', hint: '找第一个值', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.find(function (xzy_v) { return xzy_v > 10; });
                return {
                    code: 'arr.find(x => x > 10)',
                    ret: xzy_ret,
                    note: '返回第一个让回调返回 true 的<em>元素本身</em>，找到就停止遍历，找不到返回 undefined。',
                    steps: xzy_arr.map(function (xzy_v) {
                        return xzy_v > 10
                            ? { t: xzy_v + ' ✓ 命中', c: 'xzy_keep' }
                            : { t: String(xzy_v), c: '' };
                    })
                };
            }
        },
        {
            key: 'findIndex', cat: 'find', name: 'findIndex()', hint: '找第一个下标', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.findIndex(function (xzy_v) { return xzy_v > 10; });
                return {
                    code: 'arr.findIndex(x => x > 10)',
                    ret: xzy_ret,
                    note: '和 find 一模一样，只是返回<em>下标</em>而不是元素值。',
                    steps: xzy_arr.map(function (xzy_v, xzy_i) {
                        return xzy_v > 10
                            ? { t: 'index ' + xzy_i + ' 命中', c: 'xzy_keep' }
                            : { t: 'index ' + xzy_i, c: '' };
                    })
                };
            }
        },
        {
            key: 'at', cat: 'find', name: 'at()', hint: '按下标取值', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.at(-1);
                return {
                    code: 'arr.at(-1)',
                    ret: xzy_ret,
                    note: '支持<em>负数下标</em>，-1 表示最后一项，-2 表示倒数第二项，比 arr[arr.length - 1] 更简洁。',
                    steps: []
                };
            }
        },
        {
            key: 'forEach', cat: 'iter', name: 'forEach()', hint: '逐个处理', mut: false,
            run: function () {
                var xzy_sum = 0;
                var xzy_steps = [];
                xzy_arr.forEach(function (xzy_v) {
                    xzy_sum += xzy_v;
                    xzy_steps.push({ t: xzy_v + ' → 累计 ' + xzy_sum, c: '' });
                });
                return {
                    code: 'let sum = 0;\narr.forEach(x => sum += x);',
                    ret: xzy_sum,
                    note: '只是把每个元素交给回调执行，<em>没有返回值（undefined）</em>，这里借外部变量 sum 记录结果。',
                    steps: xzy_steps
                };
            }
        },
        {
            key: 'map', cat: 'iter', name: 'map()', hint: '映射新数组', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.map(function (xzy_v) { return xzy_v * 2; });
                return {
                    code: 'arr.map(x => x * 2)',
                    ret: xzy_ret,
                    note: '对每一项执行回调，把<em>返回值收集成新数组</em>，长度不变，原数组不变。',
                    steps: xzy_arr.map(function (xzy_v) {
                        return { t: xzy_v + ' → ' + (xzy_v * 2), c: 'xzy_keep' };
                    })
                };
            }
        },
        {
            key: 'filter', cat: 'iter', name: 'filter()', hint: '筛选', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.filter(function (xzy_v) { return xzy_v > 10; });
                return {
                    code: 'arr.filter(x => x > 10)',
                    ret: xzy_ret,
                    note: '只保留回调返回 true 的元素，<em>返回长度可变的新数组</em>，原数组不变。',
                    steps: xzy_arr.map(function (xzy_v) {
                        return xzy_v > 10
                            ? { t: xzy_v + ' ✓ 保留', c: 'xzy_keep' }
                            : { t: xzy_v + ' ✗ 丢弃', c: 'xzy_drop' };
                    })
                };
            }
        },
        {
            key: 'reduce', cat: 'iter', name: 'reduce()', hint: '汇总成一个值', mut: false,
            run: function () {
                var xzy_sum = 0;
                var xzy_steps = [];
                xzy_arr.reduce(function (xzy_s, xzy_v) {
                    xzy_sum = xzy_s + xzy_v;
                    xzy_steps.push({ t: xzy_s + ' + ' + xzy_v + ' = ' + xzy_sum, c: '' });
                    return xzy_sum;
                }, 0);
                return {
                    code: 'arr.reduce((s, x) => s + x, 0)',
                    ret: xzy_sum,
                    note: '累加器 s 从初始值 0 出发，逐个把元素合并进来，最终<em>汇总成一个值</em>（求和、求最大值、统计次数都可以）。',
                    steps: xzy_steps
                };
            }
        },
        {
            key: 'every', cat: 'iter', name: 'every()', hint: '是否全部满足', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.every(function (xzy_v) { return xzy_v > 0; });
                return {
                    code: 'arr.every(x => x > 0)',
                    ret: xzy_ret,
                    note: '所有元素都满足条件才返回 true，<em>遇到第一个不满足的就停止</em>并返回 false。',
                    steps: xzy_arr.map(function (xzy_v) {
                        return xzy_v > 0
                            ? { t: xzy_v + ' ✓', c: 'xzy_keep' }
                            : { t: xzy_v + ' ✗ 中断', c: 'xzy_drop' };
                    })
                };
            }
        },
        {
            key: 'some', cat: 'iter', name: 'some()', hint: '是否至少一个满足', mut: false,
            run: function () {
                var xzy_ret = xzy_arr.some(function (xzy_v) { return xzy_v > 18; });
                return {
                    code: 'arr.some(x => x > 18)',
                    ret: xzy_ret,
                    note: '只要有一个元素满足条件就返回 true，<em>找到就立刻停止</em>遍历。',
                    steps: xzy_arr.map(function (xzy_v) {
                        return xzy_v > 18
                            ? { t: xzy_v + ' ✓ 中断', c: 'xzy_keep' }
                            : { t: String(xzy_v), c: '' };
                    })
                };
            }
        }
    ];

    var xzy_el = {
        array: document.getElementById('xzy_array'),
        len: document.getElementById('xzy_len'),
        tabs: document.getElementById('xzy_tabs'),
        methods: document.getElementById('xzy_methods'),
        reset: document.getElementById('xzy_reset'),
        name: document.getElementById('xzy_result_name'),
        badge: document.getElementById('xzy_badge'),
        code: document.getElementById('xzy_code'),
        ret: document.getElementById('xzy_ret'),
        steps: document.getElementById('xzy_steps'),
        note: document.getElementById('xzy_note'),
        before: document.getElementById('xzy_before'),
        after: document.getElementById('xzy_after'),
        delta: document.getElementById('xzy_delta')
    };

    function xzy_fmt(xzy_v) {
        if (xzy_v === undefined) {
            return 'undefined';
        }
        if (Array.isArray(xzy_v)) {
            return '[' + xzy_v.map(xzy_fmt).join(', ') + ']';
        }
        if (typeof xzy_v === 'string') {
            return '"' + xzy_v + '"';
        }
        return String(xzy_v);
    }

    function xzy_chips(xzy_box, xzy_list, xzy_before) {
        xzy_box.innerHTML = '';
        if (!xzy_list.length) {
            var xzy_empty = document.createElement('span');
            xzy_empty.className = 'xzy_empty';
            xzy_empty.textContent = '[]  空数组';
            xzy_box.appendChild(xzy_empty);
            return;
        }
        xzy_list.forEach(function (xzy_v, xzy_i) {
            var xzy_chip = document.createElement('div');
            xzy_chip.className = 'xzy_chip';
            if (xzy_before && xzy_before[xzy_i] !== xzy_v) {
                xzy_chip.className += ' xzy_chip_new';
            }
            var xzy_val = document.createElement('span');
            xzy_val.className = 'xzy_chip_val';
            xzy_val.textContent = xzy_fmt(xzy_v);
            var xzy_idx = document.createElement('span');
            xzy_idx.className = 'xzy_chip_idx';
            xzy_idx.textContent = xzy_i;
            xzy_chip.appendChild(xzy_val);
            xzy_chip.appendChild(xzy_idx);
            xzy_box.appendChild(xzy_chip);
        });
    }

    function xzy_paint_array() {
        xzy_el.len.textContent = xzy_arr.length;
        xzy_chips(xzy_el.array, xzy_arr, null);
    }

    function xzy_render_tabs() {
        xzy_el.tabs.innerHTML = '';
        xzy_cats.forEach(function (xzy_c) {
            var xzy_btn = document.createElement('button');
            xzy_btn.type = 'button';
            xzy_btn.className = 'xzy_tab' + (xzy_c.id === xzy_cat ? ' xzy_tab_on' : '');
            xzy_btn.textContent = xzy_c.name;
            xzy_btn.addEventListener('click', function () {
                xzy_cat = xzy_c.id;
                xzy_render_tabs();
                xzy_render_methods();
            });
            xzy_el.tabs.appendChild(xzy_btn);
        });
        var xzy_now = xzy_cats.filter(function (xzy_c) { return xzy_c.id === xzy_cat; })[0];
        var xzy_tip = document.createElement('span');
        xzy_tip.className = 'xzy_tab_note';
        xzy_tip.textContent = xzy_now.note;
        xzy_el.tabs.appendChild(xzy_tip);
    }

    function xzy_render_methods() {
        xzy_el.methods.innerHTML = '';
        xzy_methods.filter(function (xzy_m) { return xzy_m.cat === xzy_cat; })
            .forEach(function (xzy_m) {
                var xzy_btn = document.createElement('button');
                xzy_btn.type = 'button';
                xzy_btn.className = 'xzy_mbtn' + (xzy_m.mut ? '' : ' xzy_mbtn_immut');
                var xzy_title = document.createElement('b');
                xzy_title.textContent = xzy_m.name;
                var xzy_sub = document.createElement('small');
                xzy_sub.textContent = xzy_m.hint;
                xzy_btn.appendChild(xzy_title);
                xzy_btn.appendChild(xzy_sub);
                xzy_btn.addEventListener('click', function () {
                    xzy_run(xzy_m);
                });
                xzy_el.methods.appendChild(xzy_btn);
            });
    }

    function xzy_run(xzy_m) {
        var xzy_before_arr = xzy_arr.slice();
        var xzy_out = xzy_m.run();

        xzy_el.name.textContent = xzy_m.name;
        xzy_el.badge.textContent = xzy_m.mut ? '会改变原数组' : '不改变原数组';
        xzy_el.badge.className = 'xzy_badge' + (xzy_m.mut ? '' : ' xzy_badge_immut');
        xzy_el.code.textContent = xzy_out.code;
        xzy_el.ret.textContent = xzy_fmt(xzy_out.ret);
        xzy_el.note.innerHTML = xzy_out.note;

        xzy_el.steps.innerHTML = '';
        (xzy_out.steps || []).forEach(function (xzy_s) {
            var xzy_step = document.createElement('span');
            xzy_step.className = 'xzy_step' + (xzy_s.c ? ' ' + xzy_s.c : '');
            xzy_step.textContent = xzy_s.t;
            xzy_el.steps.appendChild(xzy_step);
        });

        var xzy_d = xzy_arr.length - xzy_before_arr.length;
        xzy_el.delta.textContent = xzy_d === 0
            ? '长度不变'
            : (xzy_d > 0 ? '+' + xzy_d + ' 项' : xzy_d + ' 项');
        xzy_el.delta.className = 'xzy_delta' + (xzy_d === 0 ? ' xzy_delta_zero' : '');

        xzy_chips(xzy_el.before, xzy_before_arr, null);
        xzy_chips(xzy_el.after, xzy_arr, xzy_before_arr);
        xzy_paint_array();
    }

    xzy_el.reset.addEventListener('click', function () {
        xzy_arr = xzy_seed.slice();
        xzy_paint_array();
        xzy_el.before.innerHTML = '';
        xzy_el.after.innerHTML = '';
        xzy_el.delta.textContent = '长度不变';
        xzy_el.delta.className = 'xzy_delta xzy_delta_zero';
        xzy_el.name.textContent = '—';
        xzy_el.badge.textContent = '待演示';
        xzy_el.badge.className = 'xzy_badge';
        xzy_el.code.textContent = '// 数组已重置为 [7, 12, 5, 8, 20]';
        xzy_el.ret.textContent = '—';
        xzy_el.steps.innerHTML = '';
        xzy_el.note.textContent = '点击上方任意方法按钮，观察数组的变化。';
    });

    xzy_render_tabs();
    xzy_render_methods();
    xzy_paint_array();

    var xzy_first = xzy_methods.filter(function (xzy_m) { return xzy_m.key === 'map'; })[0];
    xzy_run(xzy_first);
})();
</script>
</body>
</html>
