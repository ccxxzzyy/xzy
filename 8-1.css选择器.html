<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3 超有趣动画特效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(120deg, #2c3e50, #4a69bd);
            min-height: 100vh;
        }
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 40px;
            gap: 15px;
        }
        .box{
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #fff;
            font-weight: bold;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 奇偶盒子默认配色区分 */
        .box:nth-child(odd){
            background-color: #e55039;
        }
        .box:nth-child(even){
            background-color: #6a89cc;
        }

        /* 奇数统一悬浮：呼吸发光 */
        .box:nth-child(odd):hover {
            box-shadow: 0 0 30px #ff6b6b,0 0 60px #ff6b6b;
        }

        /* 偶数统一悬浮：果冻放大+变色 */
        .box:nth-child(even):hover {
            transform: scale(1.15);
            background-color: #48dbfb;
            box-shadow: 0 0 30px #48dbfb;
        }

        /* 1号：超大字体 + 3D翻转 */
        .box:first-child{
            background-color: #0984e3;
            font-size: 100px;
        }
        .box:first-child:hover{
            transform: rotateY(180deg);
            border-radius: 50%;
        }

        /* 2号：圆形+边框弹跳 */
        .box:nth-child(2):hover{
            border-radius: 50%;
            border: 6px solid #fff;
            transform: scale(1.2) translateY(-8px);
        }

        /* 3号：上浮+立体阴影 */
        .box:nth-child(3):hover{
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transform: translateY(-12px);
        }

        /* 4号：文字爆炸阴影 */
        .box:nth-child(4):hover{
            text-shadow: 0 0 10px #fff,0 0 20px #fff,0 0 30px #fff;
            transform: scale(1.2);
        }

        /* 5号：渐变+摇摆旋转 */
        .box:nth-child(5):hover{
            background: linear-gradient(45deg,#ff4757,#3742fa,#2ed573);
            transform: rotate(15deg) scale(1.1);
        }

        /* 6号：超强放大 */
        .box:nth-child(6):hover{
            transform: scale(1.3);
        }

        /* 7号：无限旋转 */
        .box:nth-child(7):hover{
            transform: rotate(360deg);
        }

        /* 8号：左右倾斜抖动 */
        .box:nth-child(8):hover{
            transform: skewX(20deg) skewY(10deg);
        }

        /* 9号：斜飞位移+旋转 */
        .box:nth-child(9):hover{
            transform: translate(15px,-15px) rotate(10deg) scale(1.1);
        }

        /* 10号：透明模糊 */
        .box:nth-child(10):hover{
            opacity: 0.4;
            filter: blur(2px);
        }

        /* 11号：圆润变圆+翠绿 */
        .box:nth-child(11):hover{
            border-radius: 30px;
            background-color: #2ecc71;
        }

        /* 12号：金色超级发光 */
        .box:nth-child(12):hover{
            background-color: #f9ca24;
            box-shadow: 0 0 40px #f9ca24,0 0 80px #f0932b;
            color: #000;
        }

        /* 3的倍数专属红边框高亮 */
        .box:nth-child(3n):hover{
            border: 4px solid #ff3838;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
